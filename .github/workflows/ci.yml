name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: erp

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp/package-lock.json

      - name: Configure environment
        run: cp .env.example .env

      - name: Start Postgres (creates erp + erp_test via db-init/)
        run: docker compose up -d --wait db

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate dev database
        run: npx prisma migrate deploy

      - name: Migrate test database
        run: DATABASE_URL="postgresql://erp:erp_local_dev@localhost:5432/erp_test" npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src tests

      - name: Build
        run: npm run build
