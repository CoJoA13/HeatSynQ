services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_dev
      POSTGRES_DB: erp
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18+ images store
      # data in a major-version-specific subdirectory (18/docker/) so `pg_upgrade --link` can work
      # without crossing a mount boundary, and they refuse to start if they find a mount at the
      # old path — even an empty one. See docker-library/postgres#1259.
      - dbdata:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports: ["80:3000"]
    environment:
      DATABASE_URL: postgresql://erp:erp_local_dev@db:5432/erp
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      # Phase 8C §6.4: the SAME folder the backup container writes to, so the app can list archives
      # and write on-demand ones. A deploy value, deliberately not a runtime Setting — the nightly
      # container cannot honor a live change, and a setting the writer ignores is half a feature.
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }
    profiles: ["prod"]

  # Phase 8B §5.1: a separate PRACTICE copy of the same image, pointed at erp_practice on its own
  # port. Its own `practice` profile (NOT `prod`), so `docker compose --profile prod up` never starts
  # it and the prod-only backup (§6.3) never adopts it. Practice-vs-production is decided
  # authoritatively by database identity (practiceMode()); PRACTICE_MODE only corroborates. The
  # shared CMD runs `prisma migrate deploy` against DATABASE_URL on start, migrating erp_practice.
  # First-population of the demo slice is a documented one-time command (npm run db:seed:demo).
  app-practice:
    build: .
    restart: unless-stopped
    ports: ["8080:3000"]
    environment:
      DATABASE_URL: postgresql://erp:erp_local_dev@db:5432/erp_practice
      PRACTICE_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      # A distinct session cookie so a practice login on :8080 never overwrites the prod token on :80
      # (cookies are host/path-scoped, not port). http.ts + proxy.ts both read this at runtime.
      SESSION_COOKIE_NAME: erp_practice_session
      # Phase 8C §6.3: NO BACKUP_DIR and NO ./backups mount, deliberately. The practice copy's data
      # is disposable (the reset re-seeds it) so it has no backup responsibility, and a trainer's
      # "Back up now" must never pollute production's archive list or staleness signal. The routes
      # also refuse it via assertNotPracticeDatabase — this is the belt to that pair of braces.
    depends_on:
      db: { condition: service_healthy }
    profiles: ["practice"]

  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://erp:erp_local_dev@db:5432/erp
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["prod"]

volumes:
  dbdata:
